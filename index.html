<!DOCTYPE html>
<html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SMS · Release 1 · Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --pri:#8A1538;--pri-700:#7A1232;--pri-800:#650E2A;--pri-500:#A3214B;--pri-400:#B23A5E;--pri-200:#E7A9BC;--pri-100:#F8E9ED;--pri-50:#FBF7F8;
  --ink:#1B1E2B;--slate:#4B5263;--grey:#7A8194;--line:#E7E9F0;--line-2:#D9DCE5;--mist:#F6F7FB;--muted:#F1F2F6;--white:#fff;--blush:#F3EDF0;
  --g7:#0B6B47;--g5:#12A66E;--g1:#E3F5EE;--a7:#7A4F00;--a5:#F2A20C;--a1:#FDF1D8;--b7:#24508F;--b1:#E6EDF7;--r7:#B42332;--r5:#C62F3B;--r1:#FCE8EA;
  --sh-card:0 1px 2px rgba(27,30,43,.04),0 12px 32px -8px rgba(101,14,42,.12);
  --sh-glow:0 0 0 4px rgba(138,21,56,.08),0 10px 24px -4px rgba(138,21,56,.42);
  --sh-ovl:0 30px 60px -24px rgba(27,30,43,.45);
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 Inter,'Noto Sans Arabic','IBM Plex Sans Arabic',system-ui,sans-serif;color:var(--ink);background:var(--blush)}
[dir=rtl] body,[dir=rtl]{font-family:'Noto Sans Arabic','IBM Plex Sans Arabic',Inter,system-ui,sans-serif}
a{color:var(--pri);text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
svg{flex-shrink:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* ---------- app shell ---------- */
#app{min-height:100vh}
.screen{animation:fadeIn .28s var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.shell{display:flex;min-height:100vh;background:linear-gradient(160deg,#FBF7F8 0%,#F6F1F3 45%,#F3EDF0 100%);position:relative;overflow:clip}
.shell:before{content:"";position:absolute;inset-block-start:-220px;inset-inline-end:-160px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(138,21,56,.08),rgba(138,21,56,0));pointer-events:none}
.side{position:relative;align-self:stretch;min-height:100vh;flex:0 0 248px;display:flex;flex-direction:column;background:linear-gradient(180deg,#741130 0%,#5A0C25 50%,#3E081A 100%);box-shadow:10px 0 30px -12px rgba(58,8,24,.5);overflow:clip;z-index:3}
[dir=rtl] .side{box-shadow:-10px 0 30px -12px rgba(58,8,24,.5)}
.side .campus{position:absolute;inset-inline:0;bottom:0;height:300px;background:url(img/campus_side.png) center bottom/cover no-repeat;pointer-events:none}
.side-scroll{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;overflow:auto;padding-bottom:230px;scrollbar-width:none}
.logo{display:flex;align-items:center;gap:12px;padding:0 10px 16px;color:#fff}
.logo .tile{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(0,0,0,.25);color:var(--pri)}
.logo b{font-size:18px;font-weight:800;display:block;line-height:1.1}
.logo small{font-size:12px;opacity:.65}
.role-cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.55);padding:4px 14px}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:12px;color:rgba(255,255,255,.8);font-weight:500;cursor:pointer;transition:background .16s var(--ease),color .16s,transform .12s;border:0;background:none;width:100%;text-align:start}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item:active{transform:scale(.98)}
.nav-item.active{background:#fff;color:var(--pri);font-weight:700;box-shadow:0 10px 24px -10px rgba(0,0,0,.55)}
.nav-item.child{min-height:40px;padding-inline-start:46px;font-size:14px}
.nav-item.child.active{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.nav-group-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px 6px;background:none;border:0;color:rgba(255,255,255,.62);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;border-radius:10px}
.nav-group-h:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav-group-h svg{transition:transform .2s var(--ease)}
.nav-group.closed .nav-group-h svg{transform:rotate(-90deg)}
[dir=rtl] .nav-group.closed .nav-group-h svg{transform:rotate(90deg)}
.nav-group .kids{display:grid;grid-template-rows:1fr;transition:grid-template-rows .25s var(--ease)}
.nav-group.closed .kids{grid-template-rows:0fr}
.nav-group .kids>div{overflow:hidden;display:flex;flex-direction:column;gap:2px}

.main{flex:1;min-width:0;padding:24px 32px 48px;display:flex;flex-direction:column;gap:22px;position:relative;z-index:1}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.crumb{font-size:14px;color:var(--slate);font-weight:500;display:flex;gap:6px;flex-wrap:wrap}
.crumb a{color:var(--slate)} .crumb a:hover{color:var(--pri)}
.title{font-size:28px;font-weight:800;letter-spacing:-.02em}
.tools{display:flex;align-items:center;gap:10px;position:relative}
.ctx{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:14px;color:var(--slate)}
.ctx b{color:var(--ink)}
.ib{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;position:relative;transition:background .15s,border-color .15s,box-shadow .15s}
.ib:hover{background:var(--pri-50);border-color:var(--line-2)}
.ib .badge{position:absolute;top:7px;inset-inline-end:7px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--pri);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;border:2px solid #fff}
.lang{height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;transition:background .15s}
.lang:hover{background:var(--pri-50)}
.lang .ar{font-family:'Noto Sans Arabic','IBM Plex Sans Arabic',sans-serif}
.profile{height:48px;padding-inline:4px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:10px;cursor:pointer;text-align:start;transition:background .15s,border-color .15s}
.profile:hover{background:var(--pri-50)}
.profile[aria-expanded=true]{border-color:var(--pri)}
.av{width:38px;height:38px;border-radius:50%;background:var(--pri-100);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.av.sm{width:32px;height:32px;font-size:12px}
.av.lg{width:56px;height:56px;font-size:20px}
.av.b{background:var(--b1);color:var(--b7)} .av.a{background:var(--a1);color:var(--a7)} .av.g{background:var(--g1);color:var(--g7)}
.who b{display:block;font-size:14px;line-height:1.2} .who small{font-size:12px;color:var(--slate)}

/* ---------- building blocks ---------- */
.card{background:#fff;border-radius:16px;padding:20px;box-shadow:var(--sh-card);border:1px solid rgba(138,21,56,.06);display:flex;flex-direction:column;gap:16px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-h h2{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.card-h h2:before{content:"";width:4px;height:20px;border-radius:2px;background:linear-gradient(180deg,var(--pri-400),var(--pri-800))}
.row{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.row>*{flex:1 1 320px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.muted{color:var(--slate)} .small{font-size:13px} .xs{font-size:12px}
.link{font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;background:none;border:0;color:var(--pri);padding:0}
.link:hover{color:var(--pri-800);text-decoration:underline}

.btn{height:44px;padding:0 20px;border-radius:999px;border:1px solid transparent;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600;cursor:pointer;white-space:nowrap;transition:background .15s var(--ease),box-shadow .15s,transform .1s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn.sm{height:38px;padding:0 16px;font-size:14px}
.btn.pri{background:linear-gradient(135deg,var(--pri-500),var(--pri));color:#fff;box-shadow:var(--sh-glow)}
.btn.pri:hover{background:linear-gradient(135deg,var(--pri),var(--pri-800));box-shadow:0 0 0 4px rgba(138,21,56,.1),0 16px 30px -10px rgba(101,14,42,.55)}
.btn.sec{background:#fff;border-color:var(--line);color:var(--ink);box-shadow:0 4px 12px -8px rgba(27,30,43,.25)}
.btn.sec:hover{background:var(--pri-50);border-color:var(--line-2)}
.btn.soft{background:var(--pri-100);color:var(--pri);border-color:rgba(138,21,56,.1)}
.btn.soft:hover{border-color:var(--pri-200)}
.btn.dan{background:#fff;color:var(--r7);border-color:rgba(180,35,50,.35)}
.btn.dan:hover{background:var(--r1)}
.btn.dan-solid{background:var(--r5);color:#fff}
.btn.dan-solid:hover{background:var(--r7)}
.btn.ghost{background:none;color:var(--pri)}
.btn.ghost:hover{background:var(--pri-50)}
.btn[disabled],.btn.dis{background:var(--muted)!important;color:var(--grey)!important;box-shadow:none!important;border-color:var(--line)!important;cursor:not-allowed}
.btn.full{width:100%}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;white-space:nowrap}
.t-pri{background:var(--pri-100);color:var(--pri)} .t-g{background:var(--g1);color:var(--g7)} .t-a{background:var(--a1);color:var(--a7)} .t-b{background:var(--b1);color:var(--b7)} .t-r{background:var(--r1);color:var(--r7)} .t-n{background:var(--muted);color:var(--slate)}
.dash{border:1.5px dashed var(--line-2)}

.kpi{position:relative;overflow:hidden;border-radius:18px;padding:22px;background:linear-gradient(145deg,#fff 45%,var(--tint) 140%);border:1px solid rgba(0,0,0,.04);box-shadow:0 2px 4px rgba(27,30,43,.04),0 16px 32px -16px var(--glow);display:flex;flex-direction:column;gap:12px;transition:transform .2s var(--ease),box-shadow .2s}
.kpi.click{cursor:pointer}
.kpi.click:hover{transform:translateY(-3px);box-shadow:0 2px 4px rgba(27,30,43,.04),0 24px 40px -18px var(--glow)}
.kpi .ic{width:46px;height:46px;border-radius:14px;background:linear-gradient(145deg,var(--tint),#fff);color:var(--fg);display:grid;place-items:center}
.kpi .v{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.kpi .l{font-weight:600} .kpi .s{font-size:13px;font-weight:600;color:var(--slate)}
.kpi .deco{position:absolute;inset-inline-end:16px;bottom:50px;opacity:.15;color:var(--fg)}
.k-pri{--tint:var(--pri-100);--fg:var(--pri);--glow:rgba(138,21,56,.2)} .k-g{--tint:var(--g1);--fg:var(--g7);--glow:rgba(18,166,110,.2)} .k-a{--tint:var(--a1);--fg:var(--a7);--glow:rgba(242,162,12,.22)} .k-b{--tint:var(--b1);--fg:var(--b7);--glow:rgba(36,80,143,.2)}
.kpi.btnlike{background:linear-gradient(135deg,var(--pri-500),var(--pri) 60%,var(--pri-800));color:#fff}
.kpi.btnlike .s,.kpi.btnlike .l{color:#fff}
.kpi.btnlike .ic{background:rgba(255,255,255,.18);color:#fff}

.hero{position:relative;overflow:hidden;border-radius:22px;min-height:250px;display:flex;color:#fff;background:linear-gradient(90deg,#560B24 0%,#650E2A 28%,#6A0F2D 40%,#6A0F2D 100%);box-shadow:0 24px 48px -20px rgba(101,14,42,.55)}
.hero .ph{position:absolute;top:0;bottom:0;inset-inline-end:0;width:62%;background-size:cover;background-position:center 30%}
.hero .ph{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 22%);mask-image:linear-gradient(90deg,transparent 0,#000 22%)}
[dir=rtl] .hero .ph{transform:scaleX(-1)}
.hero .in{position:relative;padding:32px 36px;display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:600px}
.pill-w{align-self:flex-start;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.24);padding:7px 12px;border-radius:999px}
.hero h2{font-size:26px;font-weight:500;line-height:1.3;text-shadow:0 2px 12px rgba(58,8,24,.35)}
.hbtn{height:44px;padding:0 20px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.06);color:#fff;transition:background .15s}
.hbtn:hover{background:rgba(255,255,255,.16)}
.hbtn.w{background:#fff;color:var(--pri);border-color:#fff;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.hbtn.w:hover{background:var(--pri-50)}
.band{border-radius:20px;padding:22px 24px;color:#fff;background:radial-gradient(120% 160% at 100% 0%,var(--pri-400) 0%,var(--pri) 45%,var(--pri-800) 100%);box-shadow:0 20px 40px -20px rgba(101,14,42,.6);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.band .k{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F5D3DD}
.band h2{font-size:24px;font-weight:800}
.band p{color:#F6DCE4}

/* lists, tables */
.list{list-style:none;margin:0;padding:0}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.li:first-child{border-top:0}
.li.click{cursor:pointer;border-radius:12px;padding-inline:10px;margin-inline:-10px;transition:background .15s}
.li.click:hover{background:var(--pri-50)}
.itile{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.datebadge{width:52px;height:56px;border-radius:14px;background:linear-gradient(160deg,var(--pri-400),var(--pri-800));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 8px 16px -8px rgba(101,14,42,.6)}
.datebadge b{font-size:18px;line-height:1} .datebadge small{font-size:12px;font-weight:600}
.grow{flex:1;min-width:0}
.tbl-wrap{overflow:auto;margin:0 -20px}
table{width:100%;border-collapse:collapse}
th{text-align:start;padding:12px 16px;font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;background:#FAF7F8;white-space:nowrap}
td{padding:13px 16px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr{transition:background .12s}
tbody tr:hover{background:var(--pri-50)}
tbody tr.sel{background:linear-gradient(90deg,#FBEFF3,#fff)}
tr.click{cursor:pointer}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.search{display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--slate);flex:1 1 260px;min-width:220px;transition:border-color .15s,box-shadow .15s}
.search:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px rgba(138,21,56,.08)}
.search input{border:0;outline:0;background:none;width:100%}
.dd{height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:background .15s}
.dd:hover{background:var(--pri-50)}
.dd small{color:var(--slate);font-weight:600;font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--pri-200);background:var(--pri-50)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;box-shadow:0 6px 14px -6px rgba(138,21,56,.5)}
.chip .n{font-size:12px;padding:1px 8px;border-radius:999px;background:var(--muted)}
.chip.on .n{background:rgba(255,255,255,.22)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:5px;background:#fff;border:1px solid var(--line);border-radius:999px;align-self:flex-start;box-shadow:0 4px 14px -10px rgba(27,30,43,.3)}
.tab{height:38px;padding:0 16px;border-radius:999px;border:0;background:none;font-weight:600;font-size:14px;cursor:pointer;color:var(--slate);transition:all .15s}
.tab:hover{color:var(--pri);background:var(--pri-50)}
.tab.on{background:var(--pri);color:#fff;box-shadow:0 6px 14px -6px rgba(138,21,56,.5)}
.pane{display:none;flex-direction:column;gap:20px}
.pane.on{display:flex;animation:fadeIn .22s var(--ease)}
.pager{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--slate)}
.pg{min-width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:600;cursor:pointer}
.pg.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* forms */
.f{display:flex;flex-direction:column;gap:7px;flex:1 1 240px;min-width:0}
.f>span{font-size:14px;font-weight:600}
.f em{font-style:normal;color:var(--r7)}
.inp{height:48px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:10px;transition:border-color .15s,box-shadow .15s}
.inp:focus-within{border-color:var(--pri);box-shadow:0 0 0 4px rgba(138,21,56,.08)}
.inp input,.inp select{border:0;outline:0;background:none;width:100%;height:100%}
.inp.err{border:1.5px solid var(--r5)}
.inp.ro{background:var(--mist)}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;resize:vertical;outline:0}
.hint{font-size:13px;color:var(--slate)} .errt{font-size:13px;font-weight:600;color:var(--r7);display:flex;gap:6px;align-items:center}
.fr{display:flex;flex-wrap:wrap;gap:16px}
.sw{width:46px;height:26px;border-radius:999px;background:var(--line-2);border:0;padding:3px;cursor:pointer;display:flex;transition:background .2s}
.sw:after{content:"";width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s var(--ease)}
.sw.on{background:linear-gradient(135deg,var(--pri-500),var(--pri))}
.sw.on:after{transform:translateX(20px)}
[dir=rtl] .sw.on:after{transform:translateX(-20px)}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:14px;line-height:1.45}
.n-b{background:var(--b1);color:var(--b7)} .n-a{background:var(--a1);color:var(--a7)} .n-r{background:var(--r1);color:var(--r7)} .n-g{background:var(--g1);color:var(--g7)} .n-n{background:var(--muted);color:var(--slate)}
.seg{display:flex;gap:4px;padding:4px;border-radius:12px;background:#F3F4F8}
.seg button{width:40px;height:36px;border-radius:9px;border:0;font-weight:700;background:none;color:var(--slate);cursor:pointer;transition:all .15s}
.seg button:hover{background:#fff}
.seg .P.on{background:linear-gradient(135deg,#1FB37B,#0B8A59);color:#fff}
.seg .A.on{background:linear-gradient(135deg,var(--pri-500),var(--pri));color:#fff}
.seg .L.on{background:linear-gradient(135deg,#F5B53A,#E09400);color:#3D2800}
.mark{width:84px;height:42px;border-radius:10px;border:1px solid var(--line);text-align:center;font-weight:700;font-size:16px;outline:0;transition:border-color .15s,box-shadow .15s}
.mark:focus{border-color:var(--pri);box-shadow:0 0 0 4px rgba(138,21,56,.08)}
.mark.err{border:2px solid var(--r5);background:#FFF5F6}
.mark.ro{background:var(--mist);color:var(--slate)}
.drop{border:1.5px dashed var(--pri-200);border-radius:16px;padding:26px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;background:var(--pri-50)}
.steps{display:flex;gap:10px;align-items:center}
.step{display:flex;align-items:center;gap:10px;flex:1}
.step i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px;background:var(--muted);color:var(--slate)}
.step.on i{background:linear-gradient(135deg,var(--pri-500),var(--pri));color:#fff;box-shadow:0 6px 14px -6px rgba(138,21,56,.6)}
.step.done i{background:var(--g1);color:var(--g7)}
.step b{font-size:14px}
.step-l{flex:0 0 24px;height:2px;background:var(--line)}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(27,30,43,.45);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.scrim.on{opacity:1;pointer-events:auto}
.dialog{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.98);opacity:0;pointer-events:none;width:min(540px,92vw);max-height:90vh;overflow:auto;background:#fff;border-radius:22px;padding:28px;box-shadow:var(--sh-ovl);z-index:60;display:flex;flex-direction:column;gap:18px;transition:all .22s var(--ease)}
.dialog.wide{width:min(820px,94vw)}
.dialog.on{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:auto}
.dlg-h{display:flex;gap:14px;align-items:center}
.dlg-h .itile{width:48px;height:48px;border-radius:14px}
.dlg-h h2{font-size:21px;font-weight:800}
.dlg-f{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,96vw);background:#fff;z-index:60;box-shadow:var(--sh-ovl);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .26s var(--ease)}
[dir=rtl] .drawer{transform:translateX(-105%)}
.drawer.on{transform:none!important}
.drawer.wide{width:min(720px,96vw)}
.dr-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:20px 24px;border-bottom:1px solid var(--line)}
.dr-h h2{font-size:21px;font-weight:800}
.dr-b{flex:1;overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:18px}
.dr-f{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--line);background:var(--pri-50)}
.pop{position:absolute;top:56px;inset-inline-end:0;width:380px;background:#fff;border-radius:16px;box-shadow:var(--sh-ovl);border:1px solid var(--line);z-index:40;opacity:0;transform:translateY(-6px);pointer-events:none;transition:all .18s var(--ease);overflow:hidden}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop.menu{width:280px;padding:8px 0}
.mi{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;width:100%;border:0;background:none;text-align:start}
.mi:hover{background:var(--pri-50)}
.mi.dan{color:var(--r7)}
.ni{display:flex;gap:12px;padding:12px 18px;border-top:1px solid var(--line);cursor:pointer;transition:background .15s}
.ni:hover{background:var(--pri-50)}
.ni.unread{background:var(--pri-50)}
.ni .dot{width:8px;height:8px;border-radius:50%;background:var(--pri);margin-top:6px;flex-shrink:0}
#toasts{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{width:420px;max-width:92vw;background:#fff;border-radius:12px;box-shadow:var(--sh-ovl);padding:12px 14px;display:flex;gap:12px;align-items:center;border-inline-start:4px solid var(--c);animation:toastIn .25s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.toast .itile{width:32px;height:32px;border-radius:10px}

/* auth + public */
.auth{min-height:100vh;display:flex;flex-wrap:wrap;background:linear-gradient(160deg,#FBF7F8,#F3EDF0)}
.auth aside{position:relative;overflow:hidden;flex:1 1 520px;min-height:640px;display:flex;flex-direction:column;justify-content:space-between;padding:40px 44px;color:#fff;background:#4A0A20}
.auth aside:before{content:"";position:absolute;inset:0;background:url(img/campus.jpg) 84% 50%/cover}
.auth aside:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(74,10,32,.85) 0%,rgba(101,14,42,.35) 38%,rgba(101,14,42,.55) 62%,rgba(58,8,24,.95) 100%)}
.auth aside>*{position:relative;z-index:1}
.auth aside p{font-size:30px;font-weight:600;line-height:1.25;max-width:460px}
.auth main{flex:1 1 520px;display:flex;flex-direction:column;padding:28px 40px 40px}
.auth .box{width:100%;max-width:480px;margin:auto;background:#fff;border-radius:24px;padding:36px;display:flex;flex-direction:column;gap:20px;box-shadow:0 2px 4px rgba(27,30,43,.04),0 30px 60px -24px rgba(101,14,42,.28)}
.auth h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.otp{display:flex;gap:10px;justify-content:space-between}
.otp input{width:56px;height:64px;border-radius:14px;border:1px solid var(--line);text-align:center;font-weight:700;font-size:26px;outline:0}
.otp input:focus{border:2px solid var(--pri);box-shadow:0 0 0 4px rgba(138,21,56,.1)}
.divider{display:flex;align-items:center;gap:12px;color:var(--slate);font-size:13px;font-weight:600}
.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.pub{background:linear-gradient(180deg,#FBF7F8,#F6F1F3);min-height:100vh}
.pub header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:14px 56px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line)}
.pub nav a{font-weight:500;color:var(--ink);padding:8px 2px;border-bottom:2px solid transparent;transition:color .15s,border-color .15s;cursor:pointer}
.pub nav a:hover{color:var(--pri)}
.pub nav a.on{color:var(--pri);font-weight:700;border-color:var(--pri)}
.pub .sec{padding:56px 56px 0;display:flex;flex-direction:column;gap:24px}
.pub .k{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}
.pub h2.s{font-size:34px;font-weight:800;letter-spacing:-.02em}
.acad{border-radius:22px;overflow:hidden;background:#fff;box-shadow:0 18px 36px -18px rgba(101,14,42,.3);transition:transform .2s var(--ease)}
.acad:hover{transform:translateY(-4px)}
.acad .im{height:190px;background-size:cover;background-position:center 30%}
.pubfoot{margin-top:64px;padding:40px 56px 28px;color:#E7B8C6;background:linear-gradient(180deg,#5A0C25,#3E081A)}

/* misc */
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 16px;text-align:center}
.empty .big{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:linear-gradient(145deg,var(--muted),#fff);box-shadow:inset 0 0 0 1px var(--line);color:var(--slate)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF0F4 25%,#F7F8FB 50%,#EEF0F4 75%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.cell{padding:10px 12px;border-radius:14px;border:1px solid rgba(0,0,0,.04);display:flex;flex-direction:column;gap:3px;transition:transform .15s,box-shadow .15s;cursor:pointer}
.cell:hover{transform:translateY(-2px);box-shadow:0 8px 16px -10px rgba(101,14,42,.35)}
.cell.clash{border:2px solid var(--r5);box-shadow:0 0 0 4px rgba(198,47,59,.12);background:#fff}
.ttgrid{display:grid;grid-template-columns:96px repeat(7,minmax(0,1fr));gap:8px}
.idcard{width:320px;height:200px;border-radius:16px;overflow:hidden;position:relative;background:#fff;box-shadow:0 18px 40px -18px rgba(101,14,42,.45);display:flex}
.bar{height:10px;border-radius:999px;background:#F1E4E8;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--pri-400),var(--pri-800))}
.proto-bar{position:fixed;bottom:16px;inset-inline-start:16px;z-index:70;display:flex;gap:8px}
.proto-bar button{height:36px;padding:0 14px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(27,30,43,.82);color:#fff;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.proto-bar button:hover{background:#1B1E2B}
.hub{min-height:100vh;padding:48px 56px;background:linear-gradient(160deg,#FBF7F8,#F3EDF0)}
.hub h1{font-size:40px;font-weight:800;letter-spacing:-.02em}
.hub .lane{background:#fff;border-radius:18px;padding:20px;box-shadow:var(--sh-card);display:flex;flex-direction:column;gap:12px}
.hub .lane h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.sid{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:background .15s}
.sid:hover{background:var(--pri-50)}
.sid code{font:700 12px/1 Inter,monospace;color:var(--pri);background:var(--pri-100);padding:4px 7px;border-radius:6px;min-width:58px;text-align:center}
.wf{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:14px;border:1px solid var(--line);cursor:pointer;transition:all .15s}
.wf:hover{border-color:var(--pri-200);background:var(--pri-50)}
.toolbar-r{margin-inline-start:auto}
.ttcell-h{font-size:12px;font-weight:700;color:var(--slate);text-transform:uppercase;padding:6px 8px}
.walk{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:70;background:#1B1E2B;color:#fff;border-radius:999px;padding:8px 8px 8px 18px;display:none;align-items:center;gap:12px;font-size:13px;box-shadow:var(--sh-ovl)}
.walk.on{display:flex}
.walk b{color:#F5D3DD}
.walk button{height:32px;padding:0 14px;border-radius:999px;border:0;background:#fff;color:var(--ink);font-weight:700;cursor:pointer}

.kid{height:48px;padding:0 16px 0 8px;padding-inline:8px 16px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;font:15px Inter,sans-serif;cursor:pointer;background:#fff;color:var(--ink);border:1px solid var(--line);transition:background .15s,border-color .15s,box-shadow .15s}
.kid:hover{border-color:var(--pri-400);box-shadow:0 6px 14px -8px rgba(138,21,56,.4)}
.kid small{font-size:13px;opacity:.85}
.kid .kav{width:32px;height:32px;border-radius:50%;background:var(--pri-100);color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}
.kid.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.kid.on .kav{background:#fff}

.rbar{flex:0 0 116px;height:8px;border-radius:999px;background:var(--pri-100);overflow:hidden}
.rbar>span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--pri-400),var(--pri-800));transform-origin:left;animation:barGrow .7s var(--ease) both}
[dir=rtl] .rbar>span{transform-origin:right}
@keyframes barGrow{from{transform:scaleX(0)}to{transform:none}}
.rrow:hover{background:var(--pri-50)}

.tlist{list-style:none;display:flex;flex-direction:column;gap:6px}
.trow{display:flex;align-items:center;gap:16px;padding:10px 14px;border-radius:14px;border:1px solid transparent;transition:background .15s}
.trow:hover{background:#FAF7F8}
.trow .tt{width:46px;font-weight:600;color:var(--slate)}
.trow .tbar{width:3px;align-self:stretch;min-height:36px;border-radius:2px;background:var(--line)}
.trow.next{background:linear-gradient(90deg,#F8E4EA 0%,#FBF2F5 60%,#fff 100%);border-color:rgba(138,21,56,.14);box-shadow:0 8px 18px -14px rgba(138,21,56,.45)}
[dir=rtl] .trow.next{background:linear-gradient(270deg,#F8E4EA 0%,#FBF2F5 60%,#fff 100%)}
.trow.next .tt{color:var(--pri);font-weight:700}
.trow.next .tbar{background:linear-gradient(180deg,var(--pri-500),var(--pri-800))}
.mbox{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;background:linear-gradient(110deg,#F8E9ED 0%,#FBF4F6 60%,#fff 100%)}
.mbox span{display:flex;align-items:center;gap:10px;font-weight:500}
.mbox svg{color:var(--slate)}
.tlist{padding:0;margin:0}

.side-in{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:22px 10px 0;overflow:hidden}

.glance{position:relative;overflow:hidden}
.glance>*:not(.floaty){position:relative;z-index:1}
.floaty{position:absolute;inset:0;pointer-events:none;z-index:0}
.floaty i{position:absolute;opacity:.16;display:block}
.floaty .f1{inset-inline-end:22px;bottom:18px;animation:floatA 6s ease-in-out infinite}
.floaty .f2{inset-inline-end:110px;top:20px;animation:floatB 7s ease-in-out infinite}
.floaty .f3{inset-inline-end:34px;top:46%;animation:twinkle 3.2s ease-in-out infinite}
.floaty .f4{inset-inline-end:150px;bottom:70px;animation:spinSlow 18s linear infinite}
.floaty .f5{inset-inline-end:200px;top:34px;animation:twinkle 2.6s ease-in-out .8s infinite}
@keyframes floatA{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-14px) rotate(4deg)}}
@keyframes floatB{0%,100%{transform:translate(0,0) rotate(8deg)}50%{transform:translate(-10px,12px) rotate(-6deg)}}
@keyframes twinkle{0%,100%{opacity:.08;transform:scale(.8)}50%{opacity:.35;transform:scale(1.15) rotate(20deg)}}
@keyframes spinSlow{to{transform:rotate(360deg)}}
.glance li .itile,.glance li>span:first-child{transition:transform .25s var(--ease)}
.glance li:hover>span:first-child,.glance li:hover .itile{transform:translateY(-3px) rotate(-6deg) scale(1.08)}
@media (prefers-reduced-motion:reduce){.floaty i{animation:none!important}}

.sech{display:flex;flex-direction:column;gap:4px}
.sech.sep{border-top:1px solid var(--line);padding-top:20px;margin-top:6px}
.sech h3{font-size:18px;font-weight:700;display:flex;align-items:center;gap:10px}
.sech h3:before{content:"";width:4px;height:20px;border-radius:2px;background:linear-gradient(180deg,var(--pri-400),var(--pri-800))}
.sech span{font-size:14px;color:var(--slate);padding-inline-start:14px}

.addtile{min-height:110px;border-radius:16px;border:1.5px dashed rgba(138,21,56,.35);background:transparent;color:var(--pri);font:600 15px Inter,sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:background .15s,border-color .15s,transform .15s}
.addtile:hover{background:var(--pri-50);border-color:var(--pri);transform:translateY(-2px)}

.ttgrid .cell{transition:opacity .2s,filter .2s,box-shadow .2s,transform .2s}
.ttgrid .cell.dim{opacity:.28;filter:grayscale(.6)}
.ttgrid .cell.hit{box-shadow:0 0 0 2px var(--pri),0 10px 20px -12px rgba(138,21,56,.5);transform:translateY(-1px)}

.cell.sc{position:relative;overflow:hidden;border:1px solid color-mix(in srgb,var(--c) 14%,transparent);background:linear-gradient(150deg,#fff 0%,var(--bg) 115%);padding-inline-start:16px}
.cell.sc:before{content:"";position:absolute;inset-block:8px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
[dir=rtl] .cell.sc:before{border-radius:4px 0 0 4px}
.cell.sc b{color:var(--c)}
.cell.sc .sdot{position:absolute;bottom:8px;inset-inline-end:8px;width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;color:var(--c);box-shadow:0 4px 10px -6px var(--c);opacity:.9}
.cell.sc{padding-bottom:12px}.cell.sc .xs{padding-inline-end:26px}
.cell.sc:hover{box-shadow:0 10px 20px -12px var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent)}
.cell.sc{background:linear-gradient(150deg,#fff 35%,color-mix(in srgb,var(--bg) 55%,#fff) 130%);border-color:color-mix(in srgb,var(--c) 9%,transparent)}
.cell.sc:before{width:3px;opacity:.55}
.cell.sc b{color:color-mix(in srgb,var(--c) 75%,#5a5f6e)}
.cell.sc .sdot{opacity:.55;box-shadow:none;background:color-mix(in srgb,var(--bg) 60%,#fff)}
.cell.clash{background:linear-gradient(150deg,#FFF1F2,#FDDDE1);border:2px solid #C62F3B;box-shadow:0 0 0 4px rgba(198,47,59,.16),0 12px 24px -12px rgba(198,47,59,.6);animation:clashPulse 1.8s ease-in-out infinite;z-index:1}
.cell.clash b{color:#9B1C26}
@keyframes clashPulse{0%,100%{box-shadow:0 0 0 4px rgba(198,47,59,.16),0 12px 24px -12px rgba(198,47,59,.6)}50%{box-shadow:0 0 0 8px rgba(198,47,59,.08),0 12px 24px -12px rgba(198,47,59,.6)}}
@media (prefers-reduced-motion:reduce){.cell.clash{animation:none}}

.mrsw{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;border-radius:20px;background:#fff;box-shadow:var(--sh-card);border:1px solid rgba(138,21,56,.06)}
.mrsw button{display:flex;align-items:center;gap:14px;padding:12px 16px;border:0;border-radius:15px;background:transparent;cursor:pointer;font:15px Inter,sans-serif;color:var(--ink);transition:background .2s,box-shadow .2s,transform .15s}
.mrsw button:hover:not(.on){background:var(--pri-50);transform:translateY(-1px)}
.mrsw button b{display:block;font-size:16px}
.mrsw button small{font-size:13px;color:var(--slate)}
.mrsw .ic{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--pri-100);color:var(--pri);flex-shrink:0}
.mrsw button.on{background:linear-gradient(135deg,var(--pri-500),var(--pri) 55%,var(--pri-800));color:#fff;box-shadow:0 12px 24px -12px rgba(138,21,56,.6);cursor:default}
.mrsw button.on small{color:#F5D3DD}
.mrsw button.on .ic{background:rgba(255,255,255,.18);color:#fff}
.mrsw button.on .tag{background:rgba(255,255,255,.2);color:#fff}

.rc{display:flex;flex-direction:column;gap:16px}
.rc-band{display:flex;align-items:center;gap:20px;padding:22px 28px;border-radius:22px;color:#fff;background:radial-gradient(120% 160% at 100% 0%,#B23A5E 0%,var(--pri) 45%,var(--pri-800) 100%);box-shadow:0 20px 40px -22px rgba(101,14,42,.65)}
.rc-av{width:66px;height:66px;border-radius:50%;background:#fff;color:var(--pri);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:22px;flex-shrink:0;box-shadow:0 0 0 4px rgba(255,255,255,.18)}
.rc-k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#F5D3DD}
.rc-band h2{font-size:24px;font-weight:700;margin:2px 0}
.rc-band p{font-size:14px;color:#F6DCE4;display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.rc-band p i{width:4px;height:4px;border-radius:50%;background:#F6DCE4;display:inline-block}
.rc-tot{padding-inline-start:28px;border-inline-start:1px solid rgba(255,255,255,.25);text-align:end}
.rc-tot span{font-size:14px;color:#F6DCE4}
.rc-tot b{display:block;font-size:34px;font-weight:800;line-height:1.1}
.rc-tot small{font-size:20px;font-weight:400;color:#F6DCE4}
.rc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.rc-sub{background:#fff;border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;box-shadow:0 1px 2px rgba(27,30,43,.04),0 14px 30px -20px rgba(101,14,42,.35);border:1px solid rgba(138,21,56,.06);transition:transform .2s var(--ease),box-shadow .2s}
.rc-sub:hover{transform:translateY(-3px);box-shadow:0 18px 34px -18px rgba(101,14,42,.45)}
.rc-top{display:flex;align-items:center;gap:14px}
.rc-ic{width:52px;height:52px;border-radius:50%;background:linear-gradient(150deg,#F8E4EA,#F3D4DE);color:var(--pri);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.rc-top b{font-size:17px}
.rc-score{font-size:22px;font-weight:800;color:var(--pri);line-height:1.2}
.rc-score small{font-size:14px;font-weight:500;color:var(--slate)}
.rc-stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:10px}
.rc-stats div{display:flex;flex-direction:column;gap:2px;padding-inline:10px;border-inline-start:1px solid var(--line)}
.rc-stats div:first-child{padding-inline-start:0;border:0}
.rc-stats span{font-size:12px;color:var(--slate)}
.rc-stats b{font-size:15px}
.rc-stats small{font-size:12px;font-weight:500;color:var(--slate)}
.lseg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:#F3EDF0}
.lseg .chip{justify-content:center;border:0;background:transparent;height:38px}
.lseg .chip.on{background:linear-gradient(135deg,var(--pri-500),var(--pri));color:#fff;box-shadow:0 6px 14px -6px rgba(138,21,56,.5)}

.rcwrap{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
.rcwrap .rc-grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.rcwrap .card .btn.sm{align-self:flex-start}
.lseg{display:inline-grid;grid-template-columns:auto auto}
.lseg .chip{height:34px;padding:0 18px;font-size:14px}
.rc-band{position:relative;overflow:hidden;background:linear-gradient(120deg,#5E0B26 0%,#7A1233 35%,#8A1538 55%,#A62A52 80%,#B9436A 100%)}
.rc-band>*{position:relative;z-index:1}

/* ---- auth shell ---- */
const authShell=(quote,box)=>`<div class="auth screen"><aside><div class="logo" style="padding:0"><span class="tile">${I('book',22)}</span><span><b>SMS</b><small>${T('School Management System','نظام إدارة المدرسة')}</small></span></div><div style="display:flex;flex-direction:column;gap:14px"><span class="pill-w">${T('Al Noor International School','مدرسة النور الدولية')}</span><p>${quote}</p></div></aside><main><div style="display:flex;justify-content:space-between;align-items:center"><button class="link" data-go="SH-01">${I(LANG==='ar'?'chev':'chevleft',16)}${T('Back to website','العودة إلى الموقع')}</button><button class="lang" data-lang>${I('globe',17)}${LANG==='ar'?'<span>English</span>':'<span class="ar">العربية</span>'}</button></div><div style="flex:1;display:flex;align-items:center;padding:24px 0"><section class="box">${box}</section></div></main></div>`;
const h1=(t,s,icon,k='pri')=>`<div style="display:flex;flex-direction:column;gap:10px">${icon?`<span class="itile t-${k}" style="width:52px;height:52px;border-radius:16px">${I(icon,26)}</span>`:''}<h1>${t}</h1><p class="muted">${s}</p></div>`;
const stepper=(n)=>`<div class="steps">${['Set password','Set up verification','Done'].map((s,i)=>`<div class="step${i+1===n?' on':i+1<n?' done':''}"><i>${i+1<n?I('check',16):i+1}</i><b>${s}</b></div>${i<2?'<span class="step-l"></span>':''}`).join('')}</div>`;

reg('SH-02',null,'Staff sign-in (SSO)',()=>authShell('Staff sign in with their school account.',h1('Staff sign in','Admins and teachers use the school’s own sign-in. Your second sign-in step happens there.','school')+`<div style="display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:16px;background:linear-gradient(150deg,#fff,var(--pri-100));border:1px solid rgba(138,21,56,.1)"><b>${I('key',18,'var(--pri)')} Continue to the school sign-in page</b><span class="small muted">You will come back here automatically once you are signed in.</span>${btn('Continue with school account','pri',{full:1,icon:'key',attr:'data-open="dlg-sso"'})}</div>${note('No staff password is stored in SMS. Sign-in and the second step are handled by your school.','n','info')}<div class="divider">Not staff?</div>${btn('Parent or student sign in','sec',{full:1,attr:'data-go="SH-04a"'})}`)

reg('SH-04b',null,'One-time code',()=>authShell('Your account, protected with a second step every time you sign in.',h1('Enter your verification code','We sent a 6-digit code to your e-mail or mobile ending in ••47. It expires in a few minutes.','shield')+`<div class="otp" role="group" aria-label="Verification code">${['4','8','2','9','',''].map((d,i)=>`<input inputmode="numeric" maxlength="1" value="${d}" placeholder=" " class="${i===4?'cur':''}" aria-label="Digit ${i+1}">`).join('')}</div>${btn('Verify and continue','pri',{full:1,attr:'data-open="dlg-role"'})}<div style="display:flex;justify-content:space-between;align-items:center;font-size:14px"><span class="muted">Didn't get it? <button class="link" id="resend" disabled style="opacity:.6;cursor:default" data-toast="Success|Code sent|A new code is on its way.">Resend in <span id="rs-t">0:45</span></button></span><button class="link" data-go="SH-04a">Back to sign in</button></div>${note('After 5 wrong attempts, the account locks for 15 minutes.','a','lock')}`)

reg('SH-04c',null,'Reset request',()=>authShell('Reset your password safely.',h1('Reset your password','Enter the e-mail or mobile number on your account. If it matches an account, we’ll send a reset link.','key')+field('E-mail or mobile number','fatima.ahmed@example.com',{icon:'mail',w:'1 1 auto'})+btn('Send reset link','pri',{full:1,attr:'data-open="dlg-sent"'})+`<button class="link" data-go="SH-04a">${I('chevleft',14)}Back to sign in</button>`)

reg('SH-04d',null,'Set new password',()=>authShell('Choose a new password.',h1('Set a new password','Use at least 12 characters. We check it against known leaked passwords.','lock')+field('New password','••••••••••••••',{icon:'lock',type:'password',w:'1 1 auto'})+field('Confirm password','••••••••••••••',{icon:'lock',type:'password',w:'1 1 auto'})+`<ul class="list" style="padding:12px 14px;border-radius:14px;background:#FAFAFC;border:1px solid var(--line)">${['At least 12 characters','Not found in known leaked passwords','Both passwords match'].map(x=>`<li style="display:flex;gap:10px;align-items:center;padding:4px 0;color:var(--g7);font-weight:600">${I('check',16)}${x}</li>`).join('')}</ul>`+btn('Save new password','pri',{full:1,attr:'data-go="SH-04a" data-toast="Success|Password updated|Sign in with your new password."'})));

/* app.js */
/* ===== Router + interactions ===== */
const AR_OK=new Set(['SH-04a','AD-01','AD-02']);
let CUR='HUB', WALK=null, PENDING_TAB=null;
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
function parse(){let h=decodeURIComponent(location.hash.slice(1)||'HUB');let ar=false;if(h.startsWith('ar/')){ar=true;h=h.slice(3);}if(!S[h])h='HUB';if(ar&&!AR_OK.has(h))ar=false;return {id:h,ar};}
function render(){
  const {id,ar}=parse(); CUR=id; LANG=ar?'ar':'en';
  document.documentElement.dir=ar?'rtl':'ltr'; document.documentElement.lang=ar?'ar':'en';
  const m=META[id]||{}; document.title=(id==='HUB'?'':id+' · ')+(m.name||'SMS prototype')+' · SMS';
  $('#app').innerHTML=S[id]()+`<div class="scrim" id="scrim"></div><div id="toasts" aria-live="polite"></div>`+protoBar()+walkBar();
  window.scrollTo(0,0);
  initScreen();
  if(PENDING_TAB){setTab(PENDING_TAB);PENDING_TAB=null;}
}
function go(id){
  if(id==='back'){history.back();return;}
  const ar=LANG==='ar'&&AR_OK.has(id);
  const h='#'+(ar?'ar/':'')+id;
  if(location.hash===h)render(); else location.hash=h;
}
function protoBar(){return CUR==='HUB'?'':`<div class="proto-bar"><button type="button" data-go="HUB">${I('grid',15)}Prototype map</button><button type="button" data-go="back">${I(LANG==='ar'?'chev':'chevleft',15)}Back</button><button type="button" style="cursor:default;opacity:.8">${CUR}</button></div>`;}
function walkBar(){
  if(!WALK)return '';
  const f=FLOWS.find(x=>x[0]===WALK.f), steps=f[3], i=steps.indexOf(CUR);
  if(i<0)return `<div class="walk on"><span><b>${f[0]}</b> · ${f[1]} · you left the flow</span><button data-walkto="${WALK.i}">Return to step ${WALK.i+1}</button><button data-walkend style="background:transparent;color:#fff">${I('x',15)}</button></div>`;
  WALK.i=i;
  return `<div class="walk on"><span><b>${f[0]}</b> · ${f[1]} · step ${i+1} of ${steps.length}: ${(META[steps[i]]||{}).name||steps[i]}</span>${i>0?`<button data-walkto="${i-1}" style="background:rgba(255,255,255,.14);color:#fff">Previous</button>`:''}${i<steps.length-1?`<button data-walkto="${i+1}">Next: ${(META[steps[i+1]]||{}).name||steps[i+1]}</button>`:`<button data-walkend>Finish</button>`}<button data-walkend style="background:transparent;color:#fff" aria-label="Exit walkthrough">${I('x',15)}</button></div>`;
}

/* overlays */
function closeAll(){$$('.dialog.on,.drawer.on').forEach(o=>o.classList.remove('on'));$('#scrim')&&$('#scrim').classList.remove('on');}
function closePops(except){$$('.pop.on').forEach(p=>{if(p!==except){p.classList.remove('on');const b=$(`[data-pop="${p.id}"]`);b&&b.setAttribute('aria-expanded','false');}});}
function openOv(id){
  const o=document.getElementById(id); if(!o){toast('Info|Not available|This part is not in the prototype.');return;}
  closePops(); $$('.dialog.on,.drawer.on').forEach(x=>x.classList.remove('on'));
  onOpen(id,o); o.classList.add('on'); $('#scrim').classList.add('on');
  setTimeout(()=>{const f=o.querySelector('input:not([readonly]),textarea,select,button.btn.pri');f&&f.focus({preventScroll:true});},220);
}
function toast(spec){
  const [type,title,msg]=spec.split('|'); const k={Success:['g','check'],Error:['r','alert'],Warning:['a','alert'],Info:['b','info']}[type]||['b','info'];
  const c={g:'#12A66E',r:'#C62F3B',a:'#F2A20C',b:'#24508F'}[k[0]];
  const t=document.createElement('div'); t.className='toast'; t.style.setProperty('--c',c); t.setAttribute('role',type==='Error'?'alert':'status');
  t.innerHTML=`${itile(k[1],k[0])}<div class="grow"><b style="display:block">${title}</b>${msg?`<span class="small muted">${msg}</span>`:''}</div><button class="ib" aria-label="Dismiss" data-dismiss style="width:30px;height:30px">${I('x',15)}</button>`;
  $('#toasts').appendChild(t); setTimeout(()=>{t.style.transition='opacity .3s,transform .3s';t.style.opacity='0';t.style.transform='translateY(8px)';setTimeout(()=>t.remove(),320);},4200);
}
function setTab(spec){
  const [g,i]=spec.split(':');
  $$(`[data-tab^="${g}:"]`).forEach(t=>{const on=t.dataset.tab===spec;t.classList.toggle('on',on);t.setAttribute('aria-selected',on);});
  $$(`[data-pane^="${g}:"]`).forEach(p=>p.classList.toggle('on',p.dataset.pane===spec));
}

/* screen-specific logic */
function attCount(){const c={P:0,A:0,L:0};$$('.att-row .seg button.on').forEach(b=>c[b.dataset.seg]++);for(const k in c){const e=$('#cnt-'+k);e&&(e.textContent=c[k]);}return c;}
function marksCheck(){
  const ins=$$('.mark[data-max]'); if(!ins.length)return null; let done=0,err=0;
  ins.forEach(i=>{const v=i.value.trim(),max=+i.dataset.max,h=i.parentElement.querySelector('.mhint');const bad=v!==''&&(isNaN(+v)||+v<0||+v>max);i.classList.toggle('err',bad);if(v!==''&&!bad)done++;if(bad)err++;
    if(h){h.textContent=bad?(isNaN(+v)||+v<0?'Enter a number from 0 to '+max:'More than '+max):v===''?'Not entered':'';h.style.color=bad?'var(--r7)':'var(--a7)';}});
  const total=28,entered=done+(total-ins.length>0?0:0);
  $('#m-done')&&($('#m-done').textContent=`${done} of ${total}`);$('#m-left')&&($('#m-left').textContent=`${total-done} to go`);$('#m-err')&&($('#m-err').textContent=err);
  $('#m-errnote')&&($('#m-errnote').style.display=err?'':'none');
  return {done,err,total};
}
function onOpen(id,o){
  if(id==='dlg-attsave'){const c=attCount();$('#att-sum').innerHTML=tag(c.P+' present','g')+tag(c.A+' absent','pri')+tag(c.L+' leave','a');}
  if(id==='dlg-submitmarks'){const r=marksCheck();const ok=r&&!r.err&&r.done===r.total;const b=o.querySelector('.dlg-f .btn.pri, .btn.pri');
    $('#sub-check').innerHTML=r.err?note(`${r.err} mark${r.err>1?'s are':' is'} above the maximum. Fix ${r.err>1?'them':'it'} before you submit.`,'r','alert'):r.done<r.total?note(`${r.total-r.done} students have no mark yet. Enter every mark before you submit.`,'a','alert'):note('All 28 marks are entered. After you submit, only an Admin can unlock them.','g','check');
    $$('.btn.pri',o).forEach(x=>{x.disabled=!ok;x.classList.toggle('dis',!ok);});}
}
let RS=null;
function initScreen(){
  clearInterval(RS);const rb=$('#resend');if(rb){let t=45;RS=setInterval(()=>{t--;if(t<=0){clearInterval(RS);rb.disabled=false;rb.style.opacity='';rb.style.cursor='';rb.textContent='Resend code';}else{$('#rs-t').textContent='0:'+String(t).padStart(2,'0');}},1000);}
  if($('.att-row'))attCount();
  if($('.mark[data-max]'))marksCheck();
}

/* events */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-dismiss]')){t.closest('.toast').remove();return;}
  const pop=t.closest('[data-pop]');
  if(pop){e.preventDefault();const p=document.getElementById(pop.dataset.pop);const on=!p.classList.contains('on');closePops(p);p.classList.toggle('on',on);pop.setAttribute('aria-expanded',on);return;}
  if(!t.closest('.pop'))closePops();
  if(t.id==='scrim'){closeAll();return;}
  const el=t.closest('[data-close],[data-open],[data-go],[data-toast],[data-tab],[data-gtoggle],[data-sw],[data-chip],[data-scroll],[data-markread],[data-walk],[data-walkto],[data-walkend],[data-lang],[data-showempty],[data-allp],[data-kid],[data-pick],[data-seg],[data-attsubmit],.pg');
  if(!el)return;
  if(el.disabled)return;
  const d=el.dataset;
  if(el.classList.contains('pg')){$$('.pg',el.parentElement).forEach(p=>p.classList.toggle('on',p===el));return;}
  if('seg' in d){$$('button',el.parentElement).forEach(b=>b.classList.toggle('on',b===el));attCount();return;}
  if('pick' in d){$$('.secpick',el.parentElement).forEach(k=>k.classList.toggle('on',k===el));const g=el.querySelector('b').textContent;const h=$$('.card-h h2').find(x=>x.textContent.includes('assessments'));if(h)h.textContent=g+' · Mathematics · assessments';return;}
  if('kid' in d){$$('.kid',el.parentElement).forEach(k=>{const on=k===el;k.classList.toggle('on',on);k.setAttribute('aria-pressed',on);});const [n,g]=d.kid.split('|');toast('Info|Viewing '+n+'|Showing '+g+' information.');return;}
  if('allp' in d){$$('.att-row .seg button').forEach(b=>b.classList.toggle('on',b.dataset.seg==='P'));attCount();toast('Success|All marked present|Change anyone who is absent or on leave.');return;}
  if('attsubmit' in d){$('#att-live').style.display='none';$('#att-done').style.display='';}
  if('showempty' in d){const a=$('#usertbl'),b=$('#userempty');const show=b.style.display==='none';b.style.display=show?'':'none';a.style.display=show?'none':'';$('.search input')&&( $('.search input').value=show?'Zayed Al-Kubaisi':'');return;}
  if('tab' in d){setTab(d.tab);return;}
  if('gtoggle' in d){const g=el.closest('.nav-group');const c=g.classList.toggle('closed');c?closedGroups.add(d.gtoggle):closedGroups.delete(d.gtoggle);el.setAttribute('aria-expanded',!c);return;}
  if('sw' in d){const on=el.classList.toggle('on');el.setAttribute('aria-checked',on);return;}
  if('chip' in d){
    const sibs=[...el.parentElement.children].filter(x=>'chip' in x.dataset);
    if(el.classList.contains('chip')){if(el.closest('.drawer')||sibs.length<6){sibs.forEach(s=>s.classList.toggle('on',s===el));}else el.classList.toggle('on');}
    else if(el.classList.contains('nav-item')){sibs.forEach(s=>{const on=s===el;s.classList.toggle('active',on);s.style.background=on?'linear-gradient(135deg,var(--pri-500),var(--pri))':'';s.style.color=on?'#fff':'var(--ink)';});const h=el.closest('.row').querySelector('.card-h h2');h&&(h.textContent=el.querySelector('span').textContent+' · sections');}
    else if(el.classList.contains('kpi')){sibs.forEach(s=>{const on=s===el;s.classList.toggle('k-pri',on);s.style.border=on?'2px solid var(--pri)':'0';});}
    else sibs.forEach(s=>s.style.background=s===el?'var(--pri-50)':'none');
    return;}
  if('scroll' in d){e.preventDefault();const s=document.getElementById(d.scroll);s&&s.scrollIntoView({behavior:'smooth',block:'start'});$$('[data-scroll]').forEach(a=>a.classList.toggle('on',a===el));return;}
  if('markread' in d){$$('.ni.unread').forEach(n=>n.classList.remove('unread'));const b=$('#notif-badge');b&&b.remove();return;}
  if('lang' in d){
    if(LANG==='ar'){location.hash='#'+CUR;return;}
    if(AR_OK.has(CUR)){location.hash='#ar/'+CUR;return;}
    toast('Info|Arabic preview|In this prototype, the Arabic (right-to-left) version is shown for Sign in, the Admin dashboard and Users & access.');return;}
  if('walk' in d){const f=FLOWS.find(x=>x[0]===d.walk);WALK={f:f[0],i:0};go(f[3][0]);return;}
  if('walkto' in d){const f=FLOWS.find(x=>x[0]===WALK.f);go(f[3][+d.walkto]);return;}
  if('walkend' in d){WALK=null;go('HUB');return;}
  if('close' in d)closeAll();
  if(d.toast)toast(d.toast);
  if(d.open){e.preventDefault();openOv(d.open);}
  if(d.go){e.preventDefault();if(d.tabgo)PENDING_TAB=d.tabgo;closeAll();closePops();go(d.go);}
});
function ttFilter(){const q=($('.ttq')||{}).value?.toLowerCase()||'';const t=$('select[data-f=t]')?.value||'',su=$('select[data-f=s]')?.value||'';let n=0,all=$$('.ttgrid .cell[data-s]');all.forEach(c=>{const ok=(!q||(c.dataset.s+' '+c.dataset.t).toLowerCase().includes(q))&&(!t||c.dataset.t===t)&&(!su||c.dataset.s===su);c.classList.toggle('dim',!ok);c.classList.toggle('hit',ok&&!!(q||t||su));if(ok)n++;});const ct=$('#ttcount');if(ct)ct.textContent=(q||t||su)?`${n} of ${all.length} periods match`:'';}
document.addEventListener('change',e=>{if(e.target.matches('.ttf'))ttFilter();});
document.addEventListener('input',e=>{if(e.target.matches('.attq')){const q=e.target.value.toLowerCase();let n=0;$$('.att-row').forEach(r=>{const ok=r.textContent.toLowerCase().includes(q);r.style.display=ok?'':'none';if(ok)n++;});$('#att-none').style.display=n?'none':'';}if(e.target.matches('.ttq'))ttFilter();if(e.target.matches('.mark[data-max]'))marksCheck();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeAll();closePops();return;}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button]:not(button),tr[data-go],tr[data-open],li[data-go],li[data-open]')){e.preventDefault();e.target.click();}
});
window.addEventListener('hashchange',render);
render();
</script></body></html>
